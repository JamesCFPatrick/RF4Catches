<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RF4 Catches — Analytics</title>
    <link href="/vendor/fonts.css" rel="stylesheet">
    <link href="/vendor/daisyui.css" rel="stylesheet" type="text/css">
    <link href="/site.css" rel="stylesheet">
    <script src="/vendor/tailwind-browser.js"></script>
    <script src="/vendor/htmx.min.js"></script>
    <script src="/site.js"></script>
</head>
<body data-theme="night" class="app-shell min-h-screen bg-base-200 text-base-content" style="font-family: 'Roboto Mono', monospace;">
<main class="mx-auto max-w-7xl px-4 py-10 lg:px-8">
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-4">
            <div class="rounded-box bg-accent p-3 font-bold text-accent-content">STATS</div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Analytics</h1>
                <p class="mt-1 text-base-content/70">Earnings, catch rates, and species breakdowns</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-2">
            <a class="btn btn-outline" href="/">Dashboard</a>
            <a class="btn btn-outline" href="/history">Catch history</a>
            <a class="btn btn-outline" href="/roi">Configure detection</a>
        </div>
    </header>

    <div id="analytics-content"
         hx-get="/analytics/content"
         hx-trigger="load, sessionChanged from:body"
         hx-swap="innerHTML"
         hx-sync="this:replace">
        <div class="flex items-center justify-center py-20">
            <span class="loading loading-spinner loading-lg text-accent"></span>
        </div>
    </div>
</main>

<dialog id="confirm-modal" class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Confirm</h3>
        <p id="confirm-modal-message" class="py-4"></p>
        <div class="modal-action">
            <button type="button" id="confirm-modal-cancel" class="btn btn-ghost">Cancel</button>
            <button type="button" id="confirm-modal-confirm" class="btn btn-error">Delete</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button aria-label="Close">close</button>
    </form>
</dialog>

<div id="toast-container" class="toast toast-end toast-bottom z-50"></div>
</body>
</html>
