<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RF4 Catches — History</title>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link href="/vendor/daisyui.css" rel="stylesheet" type="text/css">
  <link href="/site.css" rel="stylesheet">
  <script src="/vendor/tailwind-browser.js"></script>
  <script src="/vendor/htmx.min.js"></script>
  <script src="/site.js"></script>
</head>
<body data-theme="night" class="app-shell min-h-screen bg-base-200 text-base-content" style="font-family: 'Roboto Mono', monospace;">
  <main class="mx-auto max-w-7xl px-4 py-10 lg:px-8">
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-center gap-4">
        <div class="rounded-box bg-secondary p-3 font-bold text-secondary-content">HIST</div>
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Catch history</h1>
          <p class="mt-1 text-base-content/70">Browse catches grouped by fishing session</p>
        </div>
      </div>
      <a class="btn btn-outline" href="/">Back to dashboard</a>
    </header>

    <div id="history-content"
         hx-get="/history/content"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML">
      <div class="flex items-center justify-center py-20">
        <span class="loading loading-spinner loading-lg text-secondary"></span>
      </div>
    </div>
  </main>
</body>
</html>
