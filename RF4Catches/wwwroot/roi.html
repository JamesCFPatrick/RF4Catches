<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RF4 Catches — OCR ROI editor</title>
  <link href="/vendor/fonts.css" rel="stylesheet">
  <link href="/vendor/daisyui.css" rel="stylesheet" type="text/css">
  <link href="/site.css" rel="stylesheet">
  <script src="/vendor/tailwind-browser.js"></script>
  <script src="/vendor/htmx.min.js"></script>
  <script src="/site.js"></script>
  <style>
    .image-viewport { max-height: 75vh; overflow: auto; }
    .image-stage { position: relative; display: inline-block; touch-action: none; cursor: crosshair; }
    #sample-image { display: block; width: 1000px; max-width: none; height: auto; user-select: none; }
    .selection { position: absolute; border: 3px solid #16a36a; background: #16a36a22; pointer-events: none; box-sizing: border-box; }
  </style>
</head>
<body data-theme="night" class="app-shell min-h-screen bg-base-200 text-base-content" style="font-family: 'Roboto Mono', monospace;">
  <main class="mx-auto max-w-6xl px-4 py-10 lg:px-8">
  <header class="mb-8 flex items-center gap-4">
    <div class="rounded-box bg-primary p-3 font-bold text-primary-content">ROI</div>
    <div><h1 class="text-3xl font-bold tracking-tight">OCR region editor</h1>
    <p class="mt-1 text-base-content/70">Tune the catch-card crop once, then use it for every session.</p>
      <a class="btn btn-outline" href="/">Back to dashboard</a>
    </div>
  </header>
  <section class="card border border-base-300 bg-base-100 shadow-xl">
    <div class="card-body">
    <div class="mb-2 flex items-center gap-2"><span class="badge badge-primary">Step 1</span><h2 class="card-title">Choose a sample screenshot</h2></div>
    <form hx-post="/roi/upload" hx-encoding="multipart/form-data" hx-target="#editor" hx-swap="innerHTML">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end"><label class="form-control grow"><span class="label-text">Screenshot</span><input class="file-input file-input-bordered w-full" type="file" name="image" accept="image/png,image/jpeg,image/bmp,image/tiff" required></label>
      <button class="btn btn-primary" type="submit">Upload and select region</button></div>
    </form>
    </div>
  </section>
  <section class="card mt-6 border border-base-300 bg-base-100 shadow-xl"><div class="card-body" id="editor"><div class="flex items-center gap-3 text-base-content/60"><span class="loading loading-spinner loading-sm"></span><p>Choose an image to begin.</p></div></div></section>
  <section class="card mt-6 border border-base-300 bg-base-100 shadow-xl"><div class="card-body"><div class="mb-3 flex items-center gap-2"><span class="badge badge-secondary">Step 2</span><h2 class="card-title">Saved profiles</h2></div><div id="saved-profiles" hx-get="/roi/profiles" hx-trigger="load"></div></div></section>
  </main>
  <script>
    let antiForgeryToken = null;
    async function loadAntiForgeryToken() {
      const response = await fetch('/roi/antiforgery-token');
      antiForgeryToken = (await response.json()).token;
    }
    document.addEventListener('htmx:configRequest', event => {
      if (antiForgeryToken) event.detail.headers['X-CSRF-TOKEN'] = antiForgeryToken;
    });
    function initialiseRoiEditor() {
      const stage = document.querySelector('[data-roi-editor] #image-stage');
      const selection = document.querySelector('[data-roi-editor] #selection');
      const image = document.querySelector('[data-roi-editor] #sample-image');
      const viewport = document.querySelector('[data-roi-editor] #image-viewport');
      const zoomLabel = document.querySelector('[data-roi-editor] #zoom-label');
      if (!stage || !image || !viewport || stage.dataset.ready) return;
      stage.dataset.ready = 'true';
      let start = null;
      let zoom = 1;
      let baseWidth = 1000;
      const setZoom = value => {
        zoom = Math.max(0.5, Math.min(3, value));
        image.style.width = `${Math.round(baseWidth * zoom)}px`;
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      };
      const fitImage = () => {
        baseWidth = Math.min(image.naturalWidth || 1000, 1000);
        const availableWidth = Math.max(320, viewport.clientWidth - 16);
        setZoom(Math.min(1, availableWidth / baseWidth));
      };
      image.addEventListener('load', fitImage, { once: true });
      if (image.complete) fitImage();
      document.querySelector('[data-roi-editor] #zoom-out').addEventListener('click', () => setZoom(zoom - 0.25));
      document.querySelector('[data-roi-editor] #zoom-in').addEventListener('click', () => setZoom(zoom + 0.25));
      document.querySelector('[data-roi-editor] #zoom-fit').addEventListener('click', fitImage);
      viewport.addEventListener('wheel', event => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        setZoom(zoom + (event.deltaY < 0 ? 0.1 : -0.1));
      }, { passive: false });
      const setInput = (id, value) => document.getElementById(id).value = value.toFixed(6);
      const update = (event) => {
        const bounds = stage.getBoundingClientRect();
        const currentX = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        const currentY = Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height));
        const x = Math.min(start.x, currentX), y = Math.min(start.y, currentY);
        const width = Math.abs(currentX - start.x), height = Math.abs(currentY - start.y);
        selection.hidden = false;
        selection.style.left = (x * 100) + '%'; selection.style.top = (y * 100) + '%';
        selection.style.width = (width * 100) + '%'; selection.style.height = (height * 100) + '%';
        setInput('roi-x', x); setInput('roi-y', y); setInput('roi-width', width); setInput('roi-height', height);
      };
      stage.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        const bounds = stage.getBoundingClientRect();
        start = { x: (event.clientX - bounds.left) / bounds.width, y: (event.clientY - bounds.top) / bounds.height };
        stage.setPointerCapture(event.pointerId); update(event);
      });
      stage.addEventListener('pointermove', event => { if (start) update(event); });
      stage.addEventListener('pointerup', () => { start = null; });
    }
    document.addEventListener('htmx:afterSwap', initialiseRoiEditor);
    initialiseRoiEditor();
    loadAntiForgeryToken();
  </script>
  <!-- Shared confirmation modal + toast stack. These live in the page shell
         (not in HTMX-swapped content) so listeners survive content refreshes. -->
  <dialog id="confirm-modal" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Confirm</h3>
      <p id="confirm-modal-message" class="py-4"></p>
      <div class="modal-action">
        <button type="button" id="confirm-modal-cancel" class="btn btn-ghost">Cancel</button>
        <button type="button" id="confirm-modal-confirm" class="btn btn-error">Delete</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button aria-label="Close">close</button>
    </form>
  </dialog>

  <div id="toast-container" class="toast toast-end toast-bottom z-50"></div>
</body>
</html>
